<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ① 改成文章标题 -->
<title>文章标题 — 聚合叉的博客</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F5F0;
    --bg-card: #FFFFFF;
    --bg-code: #F0EDE8;
    --text-primary: #1A1814;
    --text-secondary: #5C5850;
    --text-tertiary: #9A948A;
    --accent: #C4622A;
    --accent-light: #FAE8DC;
    --accent-mid: #E8855A;
    --info: #185FA5;
    --info-light: #E6F1FB;
    --danger: #993C1D;
    --danger-light: #FAECE7;
    --success: #0F6E56;
    --success-light: #E1F5EE;
    --border: rgba(60,50,40,0.1);
    --border-strong: rgba(60,50,40,0.2);
    --serif: 'Noto Serif SC', Georgia, serif;
    --sans: 'Noto Sans SC', system-ui, sans-serif;
    --mono: 'JetBrains Mono', monospace;
  }

  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text-primary);
    font-family: var(--sans);
    font-weight: 300;
    line-height: 1.85;
    min-height: 100vh;
  }

  /* ── Header ── */
  .site-header {
    border-bottom: 0.5px solid var(--border);
    padding: 18px 0;
    position: sticky;
    top: 0;
    background: rgba(247,245,240,0.9);
    backdrop-filter: blur(12px);
    z-index: 100;
  }
  .header-inner {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .site-name {
    font-family: var(--serif);
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: 0.02em;
    text-decoration: none;
  }
  .header-tag {
    font-size: 11px;
    color: var(--text-tertiary);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    font-weight: 400;
  }

  /* ── Hero ── */
  .hero {
    max-width: 780px;
    margin: 0 auto;
    padding: 72px 32px 48px;
    border-bottom: 0.5px solid var(--border);
    animation: fadeUp 0.6s ease both;
  }
  .kicker {
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .kicker::after {
    content: '';
    display: block;
    height: 1px;
    width: 40px;
    background: var(--accent-mid);
    opacity: 0.5;
  }
  .headline {
    font-family: var(--serif);
    font-size: 42px;
    font-weight: 700;
    line-height: 1.25;
    color: var(--text-primary);
    margin-bottom: 20px;
    letter-spacing: -0.01em;
  }
  .headline em { font-style: normal; color: var(--accent); }
  .deck {
    font-size: 16px;
    color: var(--text-secondary);
    font-weight: 300;
    line-height: 1.75;
    max-width: 560px;
    margin-bottom: 32px;
  }
  .meta-row {
    display: flex;
    align-items: center;
    gap: 20px;
    font-size: 12px;
    color: var(--text-tertiary);
  }
  .meta-row span { display: flex; align-items: center; gap: 5px; }

  /* ── Layout ── */
  .content-wrap {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 32px;
    display: grid;
    grid-template-columns: 1fr 220px;
    gap: 0 48px;
    align-items: start;
  }
  .article-body {
    padding: 48px 0 80px;
    min-width: 0;
    animation: fadeUp 0.6s 0.1s ease both;
  }
  .sidebar {
    padding: 48px 0 80px;
    position: sticky;
    top: 72px;
    animation: fadeUp 0.6s 0.15s ease both;
  }

  /* ── Sidebar TOC ── */
  .toc-label {
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    font-weight: 500;
    margin-bottom: 14px;
  }
  .toc-list {
    list-style: none;
    border-left: 1px solid var(--border-strong);
    padding-left: 14px;
  }
  .toc-list li { margin-bottom: 8px; }
  .toc-list a {
    font-size: 12px;
    color: var(--text-tertiary);
    text-decoration: none;
    font-weight: 400;
    line-height: 1.5;
    transition: color 0.2s;
    display: block;
  }
  .toc-list a:hover { color: var(--accent); }
  .toc-list a.active { color: var(--accent); font-weight: 500; }

  /* ── Typography ── */
  .section-label {
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-tertiary);
    font-weight: 500;
    margin: 52px 0 10px;
  }
  .section-heading {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 18px;
    line-height: 1.4;
  }
  .body-text {
    font-size: 15px;
    color: var(--text-primary);
    margin-bottom: 18px;
    font-weight: 300;
    line-height: 1.9;
  }
  .body-text strong { font-weight: 500; }

  /* ── Callout ── */
  .callout {
    border-left: 2px solid var(--accent);
    padding: 16px 20px;
    background: var(--accent-light);
    border-radius: 0 8px 8px 0;
    margin: 28px 0;
  }
  .callout p { font-size: 14px; color: var(--danger); font-weight: 400; line-height: 1.75; margin: 0; }
  .callout.info { border-color: var(--info); background: var(--info-light); }
  .callout.info p { color: var(--info); }
  .callout.success { border-color: var(--success); background: var(--success-light); }
  .callout.success p { color: var(--success); }

  /* ── Pull quote ── */
  .pull-quote {
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 600;
    color: var(--text-primary);
    line-height: 1.6;
    padding: 32px 0;
    margin: 36px 0;
    border-top: 1.5px solid var(--accent);
    border-bottom: 0.5px solid var(--border);
    position: relative;
  }
  .pull-quote::before {
    content: '\201C';
    font-family: var(--serif);
    font-size: 72px;
    color: var(--accent);
    opacity: 0.15;
    position: absolute;
    top: 10px; left: -8px;
    line-height: 1;
  }

  /* ── Code block ── */
  .code-block {
    background: var(--bg-code);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 16px 18px;
    margin: 16px 0;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.75;
    color: var(--text-primary);
    overflow-x: auto;
  }
  .code-block .comment { color: var(--text-tertiary); }
  .code-block .highlight { color: var(--accent); font-weight: 500; }
  .code-block .green { color: var(--success); }
  .code-block .blue { color: var(--info); }

  /* ── Tags ── */
  .tag-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 48px;
    padding-top: 24px;
    border-top: 0.5px solid var(--border);
  }
  .tag {
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 20px;
    border: 0.5px solid var(--border-strong);
    color: var(--text-secondary);
    font-weight: 400;
    text-decoration: none;
    transition: all 0.2s;
  }
  .tag:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Footer ── */
  .site-footer {
    border-top: 0.5px solid var(--border);
    padding: 28px 32px;
    max-width: 780px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--text-tertiary);
  }

  /* ── Animation ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Responsive ── */
  @media (max-width: 680px) {
    .content-wrap { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    .headline { font-size: 28px; }
    .hero { padding: 40px 20px 32px; }
    .content-wrap { padding: 0 20px; }
    .header-inner { padding: 0 20px; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="site-name" href="../index.html">聚合叉的博客</a>
    <!-- ② 改成文章所属分类 -->
    <span class="header-tag">分类名称</span>
  </div>
</header>

<!-- ③ 填写 Hero 区域 -->
<section class="hero">
  <!-- kicker：文章小类型标签，如"技术深度分析" -->
  <p class="kicker">技术深度分析</p>
  <!-- 大标题，支持 <em> 高亮关键词 -->
  <h1 class="headline">文章大标题</h1>
  <!-- 副标题/摘要 -->
  <p class="deck">一两句话简要介绍这篇文章讲什么。</p>
  <div class="meta-row">
    <span>📖 阅读约 X 分钟</span>
    <span>🏷 标签1 · 标签2</span>
    <span>📅 2026-05-27</span>
  </div>
</section>

<div class="content-wrap">
  <article class="article-body">

    <!-- ════════════════════════════
         在这里写文章正文
         常用组件：
           .section-label   — 小节序号标签（配合 id 做 TOC 锚点）
           .section-heading — 小节标题
           .body-text       — 正文段落
           .callout         — 提示框（默认橙色，加 .info/.success 变色）
           .pull-quote      — 引用金句
           .code-block      — 代码块
         ════════════════════════════ -->

    <p class="body-text">这里是正文第一段……</p>

    <!-- Section 1 -->
    <p class="section-label" id="s1">第一节</p>
    <h2 class="section-heading">小节标题</h2>

    <p class="body-text">这里是内容段落。支持 <strong>加粗</strong> 强调。</p>

    <div class="callout info">
      <p>这是一个蓝色信息提示框。</p>
    </div>

    <div class="callout success">
      <p>这是一个绿色成功/结论提示框。</p>
    </div>

    <div class="callout">
      <p>这是默认橙色警示提示框。</p>
    </div>

    <!-- Section 2 -->
    <p class="section-label" id="s2">第二节</p>
    <h2 class="section-heading">另一个小节</h2>

    <p class="body-text">内容段落……</p>

    <div class="pull-quote">这是一段引用金句，适合放关键观点。</div>

    <div class="code-block">
<span class="comment"># 代码示例</span>
print(<span class="highlight">"Hello, World!"</span>)
    </div>

    <!-- ④ 文章标签 -->
    <div class="tag-row">
      <a class="tag" href="#">标签1</a>
      <a class="tag" href="#">标签2</a>
    </div>

  </article>

  <!-- ⑤ 右侧目录，与上方 id="s1" / id="s2" 对应 -->
  <aside class="sidebar">
    <p class="toc-label">目录</p>
    <ul class="toc-list">
      <li><a href="#s1" class="toc-link">第一节标题</a></li>
      <li><a href="#s2" class="toc-link">第二节标题</a></li>
    </ul>
  </aside>
</div>

<footer class="site-footer">
  <a href="../index.html" style="color:inherit;text-decoration:none;">← 返回首页</a>
  <span>聚合叉的博客</span>
</footer>

<script>
  // 自动高亮 TOC 当前节
  const sections = ['s1','s2']; // ⑥ 与上方 id 保持一致
  const links = document.querySelectorAll('.toc-link');

  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        links.forEach(l => l.classList.remove('active'));
        const active = document.querySelector(`.toc-link[href="#${entry.target.id}"]`);
        if (active) active.classList.add('active');
      }
    });
  }, { rootMargin: '-30% 0px -60% 0px' });

  sections.forEach(id => {
    const el = document.getElementById(id);
    if (el) observer.observe(el);
  });
</script>
</body>
</html>
