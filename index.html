<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聚合叉的博客</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:           #F7F5F0;
  --bg-card:      #FFFFFF;
  --bg-code:      #F0EDE8;
  --sidebar-bg:   #F2EFE8;
  --text-primary:   #1A1814;
  --text-secondary: #5C5850;
  --text-tertiary:  #9A948A;
  --accent:       #C4622A;
  --accent-light: #FAE8DC;
  --accent-mid:   #E8855A;
  --info:         #185FA5;
  --info-light:   #E6F1FB;
  --danger:       #993C1D;
  --danger-light: #FAECE7;
  --success:      #0F6E56;
  --success-light:#E1F5EE;
  --border:       rgba(60,50,40,0.1);
  --border-strong:rgba(60,50,40,0.2);
  --serif: 'Noto Serif SC', Georgia, serif;
  --sans:  'Noto Sans SC', system-ui, sans-serif;
  --mono:  'JetBrains Mono', monospace;
  --topbar-h:  54px;
  --sidebar-w: 400px;
  --toc-w:     220px;
  --content-max: 740px;
}

html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text-primary); font-family: var(--sans); font-weight: 400; line-height: 1.85; min-height: 100vh; }

/* ═══ TOP BAR ═══ */
.topbar {
  position: fixed; top: 0; left: 0; right: 0;
  height: var(--topbar-h);
  background: rgba(247,245,240,0.97);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
  z-index: 300;
  display: flex; align-items: center;
}

.topbar-logo {
  width: var(--sidebar-w); min-width: var(--sidebar-w);
  height: 100%;
  display: flex; align-items: center; gap: 10px;
  padding: 0 20px;
  font-family: var(--serif); font-size: 15px; font-weight: 700;
  letter-spacing: 0.02em; color: var(--text-primary);
  text-decoration: none; cursor: pointer;
  transition: color 0.2s; flex-shrink: 0;
  border-right: 1px solid var(--border);
}
.topbar-logo:hover { color: var(--accent); }
.topbar-logo .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }

.topbar-center { flex: 1; display: flex; align-items: center; justify-content: center; }

.topbar-nav { display: flex; align-items: center; }

.topbar-nav-btn {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 14px;
  font-size: 13px; color: var(--text-tertiary);
  background: none; border: none; cursor: pointer;
  border-radius: 6px;
  transition: color 0.18s, background 0.18s;
  font-family: var(--sans);
  max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.topbar-nav-btn:hover:not(:disabled) { color: var(--accent); background: var(--accent-light); }
.topbar-nav-btn:disabled { opacity: 0.3; cursor: default; }
.topbar-nav-btn .arrow { font-size: 15px; flex-shrink: 0; }

.topbar-sep { width: 1px; height: 20px; background: var(--border-strong); margin: 0 2px; }

.topbar-right { padding: 0 20px; flex-shrink: 0; }

.topbar-hamburger {
  display: none; margin-left: auto; margin-right: 12px;
  padding: 6px 10px; background: none; border: none;
  cursor: pointer; color: var(--text-secondary); font-size: 20px; line-height: 1;
}

/* ═══ LAYOUT ═══ */
.layout { display: flex; padding-top: var(--topbar-h); min-height: 100vh; }

/* ═══ LEFT SIDEBAR ═══ */
.sidebar-left {
  width: var(--sidebar-w); min-width: var(--sidebar-w);
  position: fixed; top: var(--topbar-h); left: 0; bottom: 0;
  overflow-y: auto;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  padding: 20px 0 60px;
  z-index: 100;
  transition: transform 0.24s ease;
}
.sidebar-left::-webkit-scrollbar { width: 4px; }
.sidebar-left::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 2px; }

.nav-welcome-item {
  display: flex; align-items: center; gap: 10px;
  margin: 0 14px 4px; padding: 9px 16px 9px 24px;
  font-size: 15px; font-weight: 500;
  color: var(--text-secondary); text-decoration: none;
  border-radius: 8px; cursor: pointer;
  transition: background 0.15s, color 0.15s;
  position: relative;
}
.nav-welcome-item:hover  { background: rgba(196,98,42,0.08); color: var(--accent); }
.nav-welcome-item.active { color: var(--accent); background: var(--accent-light); }
.nav-welcome-item.active::before {
  content: ''; position: absolute; left: 0; top: 6px; bottom: 6px;
  width: 3px; border-radius: 0 2px 2px 0; background: var(--accent);
}

.nav-group { margin-bottom: 4px; }

.nav-group-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 20px 6px 28px;
  cursor: pointer; user-select: none;
  transition: color 0.15s;
}
.nav-group-header:hover .nav-group-title { color: var(--accent); }

.nav-group-left { display: flex; align-items: center; gap: 8px; }
.nav-group-icon { font-size: 15px; opacity: 0.65; line-height: 1; }
.nav-group-title {
  font-size: 13px; font-weight: 600;
  letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--text-secondary); transition: color 0.15s;
}
.nav-group-chevron {
  font-size: 11px; color: var(--text-tertiary);
  transition: transform 0.2s; flex-shrink: 0;
}
.nav-group.collapsed .nav-group-chevron { transform: rotate(-90deg); }

.nav-group-body { overflow: hidden; transition: max-height 0.25s ease; }
.nav-group.collapsed .nav-group-body { max-height: 0 !important; }

.nav-item {
  display: flex; align-items: flex-start; gap: 0;
  margin: 1px 14px; padding: 8px 16px 8px 24px;
  font-size: 14.5px; color: var(--text-secondary);
  text-decoration: none; border-radius: 8px;
  cursor: pointer; transition: background 0.15s, color 0.15s;
  line-height: 1.5; position: relative;
}
.nav-item:hover  { background: rgba(196,98,42,0.07); color: var(--text-primary); }
.nav-item.active { background: var(--accent-light); color: var(--accent); font-weight: 500; }
.nav-item.active::before {
  content: ''; position: absolute; left: 0; top: 6px; bottom: 6px;
  width: 3px; border-radius: 0 2px 2px 0; background: var(--accent);
}

.nav-item-num {
  font-size: 12px; color: var(--text-tertiary);
  margin-right: 8px; min-width: 18px;
  font-family: var(--mono); flex-shrink: 0; padding-top: 1px;
}
.nav-item.active .nav-item-num { color: var(--accent-mid); }

.nav-empty { padding: 6px 14px 8px 44px; font-size: 13px; color: var(--text-tertiary); font-style: italic; }
.nav-divider { height: 1px; background: var(--border); margin: 10px 20px 16px; }

/* ═══ MAIN ═══ */
.main { margin-left: var(--sidebar-w); flex: 1; min-width: 0; display: flex; justify-content: center; }

.content-area { display: flex; align-items: flex-start; width: 100%; max-width: calc(var(--content-max) + var(--toc-w) + 60px); }

.article-outer { flex: 1; min-width: 0; max-width: var(--content-max); }

/* ═══ RIGHT TOC ═══ */
.toc-panel {
  width: var(--toc-w); min-width: var(--toc-w);
  padding: 48px 0 48px 28px;
  position: sticky; top: var(--topbar-h);
  max-height: calc(100vh - var(--topbar-h));
  overflow-y: auto; flex-shrink: 0;
}
.toc-panel::-webkit-scrollbar { width: 3px; }
.toc-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.toc-panel .toc-label {
  font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--text-tertiary); font-weight: 600;
  margin-bottom: 14px; padding-left: 14px;
}
.toc-panel .toc-list { list-style: none; border-left: 1.5px solid var(--border-strong); }
.toc-panel .toc-list li { margin-bottom: 0; }
.toc-panel .toc-list a {
  display: block; font-size: 12.5px;
  color: var(--text-tertiary); text-decoration: none;
  font-weight: 400; line-height: 1.55;
  padding: 5px 14px;
  border-left: 2px solid transparent; margin-left: -1.5px;
  transition: color 0.18s, border-color 0.18s;
}
.toc-panel .toc-list a:hover  { color: var(--text-primary); }
.toc-panel .toc-list a.active { color: var(--accent); font-weight: 500; border-left-color: var(--accent); }

/* ═══ ARTICLE OVERRIDES ═══ */
.article-outer .site-header,
.article-outer .site-footer,
.article-outer .sidebar { display: none !important; }

.article-outer .hero {
  padding: 56px 48px 40px; border-bottom: 1px solid var(--border);
  animation: fadeUp 0.45s ease both; max-width: none; margin: 0;
}
.article-outer .kicker {
  font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--accent); font-weight: 500; margin-bottom: 18px;
  display: flex; align-items: center; gap: 10px;
}
.article-outer .kicker::after { content: ''; display: block; height: 1px; width: 36px; background: var(--accent-mid); opacity: 0.5; }
.article-outer .headline { font-family: var(--serif); font-size: 34px; font-weight: 700; line-height: 1.28; color: var(--text-primary); margin-bottom: 16px; letter-spacing: -0.01em; }
.article-outer .headline em { font-style: normal; color: var(--accent); }
.article-outer .deck { font-size: 15px; color: var(--text-secondary); font-weight: 400; line-height: 1.75; max-width: 520px; margin-bottom: 26px; }
.article-outer .meta-row { display: flex; align-items: center; gap: 20px; font-size: 12px; color: var(--text-tertiary); flex-wrap: wrap; }
.article-outer .meta-row span { display: flex; align-items: center; gap: 5px; }
.article-outer .content-wrap { max-width: none; margin: 0; padding: 0; display: block; }
.article-outer .article-body { padding: 40px 48px 72px; animation: fadeUp 0.45s 0.06s ease both; }

/* Prev/next footer */
.article-nav-footer {
  display: flex; justify-content: space-between; gap: 12px;
  padding: 28px 48px 52px; border-top: 1px solid var(--border);
}
.article-nav-card {
  flex: 1; max-width: 280px; padding: 16px 18px;
  border: 1px solid var(--border); border-radius: 10px;
  cursor: pointer; text-decoration: none; color: inherit;
  transition: border-color 0.18s, box-shadow 0.18s;
  background: var(--bg-card);
}
.article-nav-card:hover { border-color: var(--accent-mid); box-shadow: 0 2px 12px rgba(196,98,42,0.08); }
.article-nav-card.next { text-align: right; margin-left: auto; }
.article-nav-card-dir {
  font-size: 11px; color: var(--text-tertiary);
  letter-spacing: 0.08em; text-transform: uppercase;
  margin-bottom: 5px; display: flex; align-items: center; gap: 5px;
}
.article-nav-card.next .article-nav-card-dir { justify-content: flex-end; }
.article-nav-card-title { font-size: 13.5px; font-weight: 500; color: var(--text-primary); line-height: 1.45; }

/* ═══ TYPOGRAPHY ═══ */
.section-label { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-tertiary); font-weight: 500; margin: 52px 0 10px; }
.section-heading { font-family: var(--serif); font-size: 22px; font-weight: 600; color: var(--text-primary); margin-bottom: 18px; line-height: 1.4; }
.body-text { font-size: 15px; color: var(--text-primary); margin-bottom: 18px; font-weight: 400; line-height: 1.9; }
.body-text strong { font-weight: 500; }
.pull-quote { font-family: var(--serif); font-size: 20px; font-weight: 600; color: var(--text-primary); line-height: 1.6; padding: 32px 0; margin: 36px 0; border-top: 1.5px solid var(--accent); border-bottom: 0.5px solid var(--border); position: relative; }
.pull-quote::before { content: '\201C'; font-family: var(--serif); font-size: 72px; color: var(--accent); opacity: 0.15; position: absolute; top: 10px; left: -8px; line-height: 1; }
.callout { border-left: 2px solid var(--accent); padding: 16px 20px; background: var(--accent-light); border-radius: 0 8px 8px 0; margin: 28px 0; }
.callout p { font-size: 14px; color: var(--danger); font-weight: 400; line-height: 1.75; margin: 0; }
.callout.info    { border-color: var(--info);    background: var(--info-light);    }
.callout.info  p { color: var(--info); }
.callout.success { border-color: var(--success); background: var(--success-light); }
.callout.success p { color: var(--success); }
.diagram { border: 0.5px solid var(--border-strong); border-radius: 12px; overflow: hidden; margin: 28px 0; background: var(--bg-card); }
.diagram-header { padding: 12px 18px; border-bottom: 0.5px solid var(--border); display: flex; align-items: center; gap: 8px; }
.diagram-label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-tertiary); font-weight: 500; }
.diagram-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.diagram-body { padding: 20px 18px; }
.compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.compare-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: 8px; padding: 16px; }
.compare-card-title { font-size: 12px; font-weight: 500; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
.compare-card-title.smooth  { color: var(--success); }
.compare-card-title.blocky  { color: var(--danger);  }
.compare-card-title.forward { color: var(--danger);  }
.compare-card-title.reverse { color: var(--success); }
.card-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.65; font-weight: 400; }
.pixel-row { display: flex; gap: 1.5px; margin-bottom: 12px; border-radius: 4px; overflow: hidden; }
.pixel-row .px { height: 18px; flex: 1; }
.flow-chain { display: flex; align-items: stretch; gap: 0; margin: 16px 0; }
.flow-step { flex: 1; background: var(--bg); border: 0.5px solid var(--border); border-radius: 8px; padding: 10px 8px; text-align: center; font-size: 11px; color: var(--text-secondary); line-height: 1.45; min-width: 0; font-weight: 400; }
.flow-step.accent { background: var(--accent-light); border-color: rgba(196,98,42,0.3); color: var(--accent); font-weight: 500; }
.flow-step.info   { background: var(--info-light);   border-color: rgba(24,95,165,0.25);  color: var(--info);   font-weight: 500; }
.flow-step.danger { background: var(--danger-light); border-color: rgba(153,60,29,0.25);  color: var(--danger); font-weight: 500; }
.flow-step span { display: block; font-size: 10px; color: var(--text-tertiary); margin-top: 3px; font-weight: 400; }
.flow-step.accent span { color: rgba(196,98,42,0.65); }
.flow-step.info   span { color: rgba(24,95,165,0.6);  }
.flow-step.danger span { color: rgba(153,60,29,0.6);  }
.flow-arrow { display: flex; align-items: center; color: var(--text-tertiary); font-size: 13px; padding: 0 4px; flex-shrink: 0; }
.reasons-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.reason-item { background: var(--bg); border: 0.5px solid var(--border); border-radius: 8px; padding: 16px; }
.reason-icon { font-size: 20px; margin-bottom: 8px; display: block; }
.reason-title { font-size: 13px; font-weight: 500; color: var(--text-primary); margin-bottom: 6px; }
.reason-desc { font-size: 12px; color: var(--text-secondary); line-height: 1.65; font-weight: 400; }
.tradeoff-table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 16px 0; }
.tradeoff-table th { text-align: left; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-tertiary); font-weight: 500; padding: 8px 12px; border-bottom: 1px solid var(--border-strong); }
.tradeoff-table td { padding: 10px 12px; border-bottom: 0.5px solid var(--border); color: var(--text-primary); font-weight: 400; vertical-align: top; line-height: 1.6; }
.tradeoff-table tr:last-child td { border-bottom: none; }
.tradeoff-table td:first-child { font-weight: 500; color: var(--text-secondary); white-space: nowrap; width: 130px; }
.lens-table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 16px 0; }
.lens-table th { text-align: left; font-size: 13px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-tertiary); font-weight: 500; padding: 7px 12px; border-bottom: 1px solid var(--border-strong); }
.lens-table td { padding: 8px 12px; border-bottom: 0.5px solid var(--border); color: var(--text-primary); font-weight: 400; vertical-align: top; line-height: 1.6; }
.lens-table tr:last-child td { border-bottom: none; }
.lens-table td:first-child { font-weight: 500; color: var(--text-secondary); white-space: nowrap; width: 90px; }
.badge { display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 20px; font-weight: 500; margin-left: 4px; }
.badge.good { background: var(--success-light); color: var(--success); }
.badge.bad  { background: var(--danger-light);  color: var(--danger);  }
.badge.mid  { background: var(--accent-light);  color: var(--accent);  }
.code-block { background: var(--bg-code); border: 0.5px solid var(--border); border-radius: 8px; padding: 16px 18px; margin: 16px 0; font-family: var(--mono); font-size: 12px; line-height: 1.75; color: var(--text-primary); overflow-x: auto; white-space: pre; }
.code-block .comment   { color: var(--text-tertiary); }
.code-block .highlight { color: var(--accent); font-weight: 500; }
.code-block .green { color: var(--success); }
.code-block .blue  { color: var(--info); }
.img-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
.img-compare-item { border-radius: 8px; overflow: hidden; border: 0.5px solid var(--border); background: var(--bg); }
.img-compare-item img { width: 100%; display: block; border-bottom: 0.5px solid var(--border); }
.img-compare-caption { padding: 10px 12px; font-size: 12px; color: var(--text-secondary); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.img-compare-caption .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.img-compare-caption .dot.red   { background: var(--danger);  }
.img-compare-caption .dot.green { background: var(--success); }
.math-block { background: var(--bg-code); border: 0.5px solid var(--border); border-radius: 8px; padding: 18px 22px; margin: 16px 0; text-align: center; }
.math-block .formula { font-family: var(--serif); font-size: 15px; color: var(--text-primary); letter-spacing: 0.03em; line-height: 2; }
.math-block .formula-label { font-size: 11px; color: var(--text-tertiary); margin-top: 6px; }
.timeline { position: relative; padding-left: 28px; margin: 16px 0; }
.timeline::before { content: ''; position: absolute; left: 7px; top: 6px; bottom: 6px; width: 1.5px; background: var(--border-strong); }
.timeline-item { position: relative; margin-bottom: 20px; }
.timeline-item:last-child { margin-bottom: 0; }
.timeline-item::before { content: ''; position: absolute; left: -23px; top: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg-card); box-shadow: 0 0 0 1.5px var(--accent); }
.timeline-label { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); font-weight: 500; margin-bottom: 4px; }
.timeline-title { font-size: 14px; font-weight: 500; color: var(--text-primary); margin-bottom: 4px; }
.timeline-desc  { font-size: 12px; color: var(--text-secondary); line-height: 1.65; }
.noise-strip { display: flex; gap: 3px; align-items: center; margin: 14px 0 8px; }
.noise-frame { flex: 1; border-radius: 6px; overflow: hidden; border: 0.5px solid var(--border); }
.noise-bar { height: 52px; width: 100%; display: flex; }
.noise-bar div { flex: 1; }
.noise-label { text-align: center; font-size: 10px; color: var(--text-tertiary); padding: 5px 4px 4px; background: var(--bg); border-top: 0.5px solid var(--border); }
.noise-arrow { font-size: 18px; color: var(--text-tertiary); flex-shrink: 0; padding: 0 2px; padding-bottom: 20px; }
.tag-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 48px; padding-top: 24px; border-top: 0.5px solid var(--border); }
.tag { font-size: 11px; padding: 4px 12px; border-radius: 20px; border: 0.5px solid var(--border-strong); color: var(--text-secondary); font-weight: 400; text-decoration: none; transition: all 0.2s; cursor: pointer; }
.tag:hover { border-color: var(--accent); color: var(--accent); }

/* ═══ WELCOME PAGE ═══ */
.welcome-wrap { padding: 72px 48px 80px; max-width: var(--content-max); animation: fadeUp 0.45s ease both; }
.welcome-eyebrow { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); font-weight: 500; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
.welcome-eyebrow::after { content: ''; display: block; height: 1px; width: 36px; background: var(--accent-mid); opacity: 0.5; }
.welcome-title { font-family: var(--serif); font-size: 40px; font-weight: 700; line-height: 1.22; color: var(--text-primary); margin-bottom: 16px; }
.welcome-desc  { font-size: 15px; color: var(--text-secondary); line-height: 1.85; max-width: 460px; margin-bottom: 44px; }
.welcome-stats { display: flex; gap: 32px; padding-bottom: 36px; margin-bottom: 36px; border-bottom: 1px solid var(--border); }
.stat-num   { font-family: var(--serif); font-size: 32px; font-weight: 700; color: var(--accent); line-height: 1; margin-bottom: 4px; }
.stat-label { font-size: 12px; color: var(--text-tertiary); letter-spacing: 0.05em; }
.welcome-section-title { font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--text-tertiary); font-weight: 600; margin-bottom: 14px; }
.welcome-cards { display: flex; flex-direction: column; gap: 8px; }
.welcome-filter-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.welcome-filter-label { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-tertiary); font-weight: 500; margin-right: 2px; }
.welcome-filter-tag { font-size: 12px; padding: 5px 14px; border-radius: 20px; border: 0.5px solid var(--border-strong); color: var(--text-secondary); font-weight: 400; cursor: pointer; transition: all 0.2s; background: transparent; font-family: var(--sans); letter-spacing: 0.02em; }
.welcome-filter-tag:hover, .welcome-filter-tag.active { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
.welcome-card { display: flex; align-items: center; gap: 14px; padding: 15px 18px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; text-decoration: none; color: inherit; transition: border-color 0.18s, box-shadow 0.18s, transform 0.15s; }
.welcome-card:hover { border-color: var(--accent-mid); box-shadow: 0 2px 12px rgba(196,98,42,0.08); transform: translateY(-1px); }
.welcome-card-icon  { font-size: 20px; flex-shrink: 0; }
.welcome-card-title { font-size: 13.5px; font-weight: 500; color: var(--text-primary); margin-bottom: 2px; }
.welcome-card-meta  { font-size: 12px; color: var(--text-tertiary); }

/* ═══ LOADING ═══ */
.loading-screen { display: flex; align-items: center; justify-content: center; gap: 8px; height: 260px; width: 100%; }
.loading-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: dotPulse 1.1s infinite; }
.loading-dot:nth-child(2) { animation-delay: 0.18s; }
.loading-dot:nth-child(3) { animation-delay: 0.36s; }
@keyframes dotPulse { 0%, 100% { opacity: 0.25; transform: scale(0.75); } 50% { opacity: 1; transform: scale(1); } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

/* ═══ MOBILE OVERLAY ═══ */
.sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(20,16,10,0.35); z-index: 99; backdrop-filter: blur(2px); }
.sidebar-overlay.show { display: block; }

/* ═══ RESPONSIVE ═══ */
@media (max-width: 1120px) {
  .toc-panel { display: none; }
  .content-area { justify-content: flex-start; }
}
@media (max-width: 720px) {
  .sidebar-left { transform: translateX(-100%); box-shadow: 4px 0 24px rgba(0,0,0,0.14); }
  .sidebar-left.open { transform: translateX(0); }
  .main { margin-left: 0; }
  .topbar-logo { width: auto; min-width: auto; border-right: none; flex: 1; }
  .topbar-center, .topbar-right { display: none; }
  .topbar-hamburger { display: flex; }
  .article-outer .hero { padding: 36px 20px 28px; }
  .article-outer .article-body { padding: 28px 20px 56px; }
  .article-nav-footer { padding: 24px 20px 44px; }
  .welcome-wrap { padding: 40px 20px 60px; }
  .welcome-title { font-size: 30px; }
  .compare-grid, .reasons-grid { grid-template-columns: 1fr; }
}

/* ═══ SHOT IMAGE GRID (visual-aesthetics) ═══ */
.shot-img-card { border-radius: 8px; overflow: hidden; border: 0.5px solid var(--border); background: var(--bg-card); }
.shot-img-wrap { position: relative; width: 100%; padding-top: 100%; background: var(--bg-code); overflow: hidden; }
.shot-img-wrap img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.shot-img-placeholder { display: none; position: absolute; inset: 0; align-items: center; justify-content: center; background: var(--bg-code); }
.shot-img-placeholder span { font-size: 12px; color: var(--text-tertiary); }
.shot-img-label { padding: 6px 10px 8px; font-size: 12px; font-weight: 500; color: var(--text-secondary); text-align: center; border-top: 0.5px solid var(--border); }
.shot-img-label span { font-size: 10px; color: var(--text-tertiary); font-family: var(--mono); margin-left: 4px; font-weight: 400; }
/* Angle list (visual-aesthetics) */
.angle-list { display: flex; flex-direction: column; gap: 0; }
.angle-row { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-bottom: 0.5px solid var(--border); }
.angle-row:last-child { border-bottom: none; }
.angle-row-text { flex: 1; min-width: 0; }
.angle-row-name { font-size: 13px; font-weight: 500; color: var(--text-primary); margin-bottom: 5px; }
.angle-row-desc { font-size: 12px; color: var(--text-tertiary); line-height: 1.65; }
.angle-row-img { width: 100px; height: 100px; flex-shrink: 0; border-radius: 6px; overflow: hidden; border: 0.5px solid var(--border); background: var(--bg-code); }
.angle-row-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
</style>
</head>
<body>

<header class="topbar">
  <a class="topbar-logo" id="logoBtn">
    <span class="logo-dot"></span>聚合叉的博客
  </a>
  <div class="topbar-center">
    <div class="topbar-nav">
      <button class="topbar-nav-btn" id="btnPrev" disabled onclick="navigateArticle(-1)">
        <span class="arrow">&#8592;</span>
        <span id="prevLabel">上一篇</span>
      </button>
      <div class="topbar-sep"></div>
      <button class="topbar-nav-btn" id="btnNext" disabled onclick="navigateArticle(1)">
        <span id="nextLabel">下一篇</span>

<div class="layout">

<script>
/* ════════════════════════════════════════════

      { id: "greenman-002", title: "第一篇：职场通用术语", file: "posts/greenman/001.html", tags: ["职场", "术语", "通用术语", "沟通场景", "新人必读"] },
      { id: "greenman-003", title: "第二篇：读懂一张需求文档", file: "posts/greenman/002.html", tags: ["职场", "术语", "需求文档", "工作流程", "实战案例"] },
      { id: "greenman-004", title: "第三篇：产品经理的专业语言", file: "posts/greenman/003.html", tags: ["职场", "术语", "产品经理", "PM", "用户研究", "数据指标"] },
      { id: "greenman-005", title: "第四篇：项目经理的专业语言", file: "posts/greenman/004.html", tags: ["职场", "术语", "产品经理", "PM", "用户研究", "数据指标"] },
      { id: "greenman-006", title: "第五篇：前端工程师的专业语言", file: "posts/greenman/005.html", tags: ["职场", "术语", "前端开发", "组件化", "性能优化", "浏览器"] },
      { id: "greenman-007", title: "第六篇：后端工程师的专业语言", file: "posts/greenman/006.html", tags: ["职场", "术语", "后端开发", "接口", "数据库", "高可用"] },
      { id: "greenman-008", title: "第七篇：数据与算法的专业语言", file: "posts/greenman/007.html", tags: ["职场", "术语", "数据分析", "算法", "机器学习", "AB测试"] },
      { id: "greenman-009", title: "第八篇：测试工程师的专业语言", file: "posts/greenman/008.html", tags: ["职场", "术语", "测试", "QA", "自动化测试", "质量保证"] }
    ] }

const FLAT = DOCS.flatMap(c => c.articles);
let currentId = null;

/* ════════ BUILD NAV ════════ */
function buildNav() {
  const root = document.getElementById('navRoot');
  let html = `
    <div style="padding:4px 10px 4px;">
      <a class="nav-welcome-item" id="nav-welcome"
         onclick="loadWelcome();closeSidebar();return false;" href="#">
        <span style="font-size:16px;line-height:1;"><span class="mdi mdi-home-outline"></span></span>欢迎
      </a>
    </div>
    <div class="nav-divider"></div>`;

  DOCS.forEach((cat, ci) => {
    html += `<div class="nav-group" id="navgroup-${ci}">
      <div class="nav-group-header" onclick="toggleGroup(${ci})">
        <div class="nav-group-left">
          <span class="nav-group-icon">${cat.icon}</span>
          <span class="nav-group-title">${cat.category}</span>
        </div>
        <span class="nav-group-chevron">▾</span>
      </div>
      <div class="nav-group-body" id="navbody-${ci}">`;

    if (!cat.articles.length) {
      html += `<div class="nav-empty">暂无文章</div>`;
    } else {
      cat.articles.forEach((a, ai) => {
        html += `<a class="nav-item" id="nav-${a.id}"
          onclick="loadArticle('${a.id}','${a.file}');closeSidebar();return false;"
          href="#${a.id}" title="${a.title}">
          <span class="nav-item-num">${String(ai).padStart(2,'0')}</span>${a.title}
        </a>`;
      });
    }
    html += `</div></div>`;
  });

  root.innerHTML = html;
  // 默认收起所有分类
  document.querySelectorAll('.nav-group').forEach(group => {
    group.classList.add('collapsed');
  });
  document.querySelectorAll('.nav-group-body').forEach(el => {
    el.style.maxHeight = '0';
  });
}

function toggleGroup(ci) {
  const group = document.getElementById('navgroup-' + ci);
  const body  = document.getElementById('navbody-'  + ci);
  if (group.classList.contains('collapsed')) {
    group.classList.remove('collapsed');
    body.style.maxHeight = body.scrollHeight + 'px';
  } else {
    group.classList.add('collapsed');
    body.style.maxHeight = '0';
  }
}

/* ════════ ACTIVE STATE ════════ */
function setActive(id) {
  document.querySelectorAll('.nav-item,.nav-welcome-item')
    .forEach(el => el.classList.remove('active'));
  const el = document.getElementById('nav-' + id);
  if (!el) return;
  el.classList.add('active');
  const body = el.closest('.nav-group-body');
  if (body) {
    const group = body.closest('.nav-group');
    if (group && group.classList.contains('collapsed'))
      toggleGroup(Number(group.id.replace('navgroup-','')));
  }
}

/* ════════ PREV / NEXT ════════ */
function updateNavBtns() {
  const idx  = FLAT.findIndex(a => a.id === currentId);
  const prev = FLAT[idx - 1] || null;
  const next = FLAT[idx + 1] || null;
  const btnPrev = document.getElementById('btnPrev');
  const btnNext = document.getElementById('btnNext');
  btnPrev.disabled = !prev;
  btnNext.disabled = !next;
  document.getElementById('prevLabel').textContent = prev ? trunc(prev.title, 14) : '上一篇';
  document.getElementById('nextLabel').textContent = next ? trunc(next.title, 14) : '下一篇';
}

function navigateArticle(dir) {
  const idx = FLAT.findIndex(a => a.id === currentId);
  const t   = FLAT[idx + dir];
  if (t) loadArticle(t.id, t.file);
}

function trunc(str, n) { return str.length > n ? str.slice(0,n) + '…' : str; }

/* ════════ WELCOME ════════ */
function loadWelcome() {
  currentId = null;
  setActive('welcome');
  history.pushState(null, '', location.pathname);
  document.title = '聚合叉的博客';
  document.getElementById('btnPrev').disabled = true;
  document.getElementById('btnNext').disabled = true;
  document.getElementById('prevLabel').textContent = '上一篇';
  document.getElementById('nextLabel').textContent = '下一篇';

  const total = FLAT.length;
  const cats  = DOCS.filter(c => c.articles.length > 0).length;

  // 收集所有标签（去重）
  const allTags = [...new Set(FLAT.flatMap(a => a.tags || []))];

  function buildCards(filterTag) {
    let html = '';
    DOCS.forEach(cat => cat.articles.forEach(a => {
      if (filterTag && !(a.tags || []).includes(filterTag)) return;
      const tagHtml = (a.tags || []).map(t =>
        `<span style="font-size:10px;padding:2px 8px;border-radius:20px;border:0.5px solid var(--border-strong);color:var(--text-tertiary);font-weight:400;">${t}</span>`
      ).join('');
      html += `<a class="welcome-card" href="#${a.id}"
        onclick="loadArticle('${a.id}','${a.file}');return false;">
        <div class="welcome-card-icon">${cat.icon}</div>
        <div style="flex:1;min-width:0;">
          <div class="welcome-card-title">${a.title}</div>
          <div class="welcome-card-meta" style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px;">
            <span>${cat.category}</span>${tagHtml}
          </div>
        </div></a>`;
    }));
    return html;
  }

  const filterBarHtml = `
    <div class="welcome-filter-bar" id="welcomeFilterBar">
      <span class="welcome-filter-label">筛选</span>
      <button class="welcome-filter-tag active" data-tag="">全部</button>
      ${allTags.map(t => `<button class="welcome-filter-tag" data-tag="${t}">${t}</button>`).join('')}
    </div>`;

  document.getElementById('contentArea').innerHTML = `
    <div class="welcome-wrap">
      <p class="welcome-eyebrow">欢迎</p>
      <h1 class="welcome-title">聚合叉的博客</h1>
      <p class="welcome-desc">记录 AI 技术的学习与思考，聚焦图像生成、语言模型和多模态方向的原理解析与深度分析。</p>
      <div class="welcome-stats">
        <div><div class="stat-num">${total}</div><div class="stat-label">篇文章</div></div>
        <div><div class="stat-num">${cats}</div><div class="stat-label">个分类</div></div>
      </div>
      ${filterBarHtml}
      <p class="welcome-section-title" style="margin-bottom:14px;">所有文章</p>
      <div class="welcome-cards" id="welcomeCards">${buildCards(null)}</div>
    </div>`;

  // 绑定筛选按钮事件
  document.getElementById('welcomeFilterBar').addEventListener('click', e => {
    const btn = e.target.closest('.welcome-filter-tag');
    if (!btn) return;
    document.querySelectorAll('.welcome-filter-tag').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tag = btn.dataset.tag || null;
    document.getElementById('welcomeCards').innerHTML = buildCards(tag);
  });

  window.scrollTo({ top: 0, behavior: 'instant' });
}

/* ════════ LOAD ARTICLE ════════ */
let _obs = null;

async function loadArticle(id, file) {
  currentId = id;
  setActive(id);
  updateNavBtns();
  history.pushState(null, '', '#' + id);

  document.getElementById('contentArea').innerHTML = `
    <div class="loading-screen">
      <div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div>
    </div>`;

  try {
    const res  = await fetch(file);
    let   text = await res.text();
    text = text.replace(/\.\.\/assets\//g, 'assets/');

    const parser = new DOMParser();
    const doc    = parser.parseFromString(text, 'text/html');
    document.title = doc.title + ' — 聚合叉的博客';

    const heroEl = doc.querySelector('.hero');
    const bodyEl = doc.querySelector('.article-body');
    const tocEl  = doc.querySelector('.sidebar');

    // 注入文章自有样式（避免多次加载叠加，用固定 id 替换）
    const oldStyle = document.getElementById('article-injected-style');
    if (oldStyle) oldStyle.remove();
    const articleStyles = doc.querySelectorAll('style');
    if (articleStyles.length) {
      const styleEl = document.createElement('style');
      styleEl.id = 'article-injected-style';
      styleEl.textContent = Array.from(articleStyles).map(s => s.textContent).join('\n');
      document.head.appendChild(styleEl);
    }

    // Prev/next footer
    const idx  = FLAT.findIndex(a => a.id === id);
    const prev = FLAT[idx - 1] || null;
    const next = FLAT[idx + 1] || null;
    let footer = '';
    if (prev || next) {
      footer = `<div class="article-nav-footer">`;
      footer += prev
        ? `<a class="article-nav-card prev" href="#${prev.id}"
             onclick="loadArticle('${prev.id}','${prev.file}');return false;">
             <div class="article-nav-card-dir">&#8592; 上一篇</div>
             <div class="article-nav-card-title">${prev.title}</div></a>`
        : `<div></div>`;
      if (next)
        footer += `<a class="article-nav-card next" href="#${next.id}"
             onclick="loadArticle('${next.id}','${next.file}');return false;">
             <div class="article-nav-card-dir">下一篇 &#8594;</div>
             <div class="article-nav-card-title">${next.title}</div></a>`;
      footer += `</div>`;
    }

    document.getElementById('contentArea').innerHTML = `
      <div class="article-outer" id="articleOuter">
        ${heroEl ? `<section class="hero">${heroEl.innerHTML}</section>` : ''}
        ${bodyEl ? `<article class="article-body">${bodyEl.innerHTML}</article>` : ''}
        ${footer}
      </div>
      ${tocEl ? `<div class="toc-panel" id="tocPanel">${tocEl.innerHTML}</div>` : ''}`;

    doc.querySelectorAll('script').forEach(orig => {
      const s = document.createElement('script');
      s.textContent = orig.textContent;
      document.body.appendChild(s);
      setTimeout(() => { try { s.remove(); } catch(_) {} }, 300);
    });

    initToc();
    window.scrollTo({ top: 0, behavior: 'instant' });

  } catch (err) {
    document.getElementById('contentArea').innerHTML = `
      <div style="padding:80px 48px;color:var(--text-secondary);">
        <p style="font-size:15px;font-weight:500;margin-bottom:10px;">加载失败</p>
        <p style="font-size:13px;color:var(--text-tertiary);">${err.message}</p>
      </div>`;
  }
}

/* ════════ TOC OBSERVER ════════ */
function initToc() {
  if (_obs) { _obs.disconnect(); _obs = null; }
  const panel = document.getElementById('tocPanel');
  if (!panel) return;
  
  const links = panel.querySelectorAll('.toc-list a');
  if (!links.length) return;

  // 使用事件委托，避免重复绑定
  const TOPBAR_H = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--topbar-h')) || 54;
  
  // 移除旧的监听器（如果存在）
  const oldHandler = panel._tocClickHandler;
  if (oldHandler) {
    panel.removeEventListener('click', oldHandler);
  }
  
  // 新的点击处理器
  const clickHandler = e => {
    const link = e.target.closest('a');
    if (!link || !link.hasAttribute('href')) return;
    
    e.preventDefault();
    const targetId = link.getAttribute('href').replace('#', '');
    if (targetId) {
      const el = document.getElementById(targetId);
      if (el) {
        const top = el.getBoundingClientRect().top + window.scrollY - TOPBAR_H - 16;
        window.scrollTo({ top, behavior: 'smooth' });
      }
    }
  };
  
  panel.addEventListener('click', clickHandler);
  panel._tocClickHandler = clickHandler; // 保存引用，便于移除

  const ids = Array.from(links).map(l => l.getAttribute('href')?.replace('#','')).filter(Boolean);
  _obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        links.forEach(l => l.classList.remove('active'));
        const a = document.querySelector(`#tocPanel .toc-list a[href="#${e.target.id}"]`);
        if (a) a.classList.add('active');
      }
    });
  }, { rootMargin: '-20% 0px -65% 0px' });
  ids.forEach(id => { const el = document.getElementById(id); if (el) _obs.observe(el); });
}

/* ════════ MOBILE ════════ */
function toggleSidebar() {
  document.getElementById('sidebarLeft').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebarLeft').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

/* ════════ ROUTING ════════ */
function route() {
  const id = location.hash.replace('#','');
  if (!id) { loadWelcome(); return; }
  const a = FLAT.find(a => a.id === id);
  a ? loadArticle(a.id, a.file) : loadWelcome();
}

document.getElementById('logoBtn').addEventListener('click', e => {
  e.preventDefault(); loadWelcome(); closeSidebar();
});

window.addEventListener('popstate', route);
buildNav();
route();
</script>
